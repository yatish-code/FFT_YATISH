<html>
    <head>
        <title>css grid </title>
        <style>
            .parent{
                width: 100%;
                background: rgb(30, 27, 27);
                display: grid;
                grid-template-columns: 10% 20% 30% 5% 35%;
                
            }
            div{
                background: rgb(236, 100, 100);
                margin: 5px;

            }
        </style>
    </head>
    <body>
        <h1>CSS GRID</h1>
        <div class="parent">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>

        </div>
    </body>

</html>
