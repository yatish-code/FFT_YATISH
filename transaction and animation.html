
<html>
<head>
    <title>Transaction and Animation</title>

    <style>
        button {
            margin-left: 700px;
            width: 100px;
            height: 50px;
            background: rgb(59, 58, 58);
            border: none;
            border-radius: 15px;
            transition: 1s;
        }

        button:hover {
            background: white;
            transform: scale(1.1);
        }
        .box {
            width: 100px;
            height: 100px;
            background: brown;
            animation: boxAnimation 1s ease-in-out infinite;
        }

        @keyframes boxAnimation {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(0.5);
            }
        }
        .load {
            width: 100px;
            height: 100px;
            border: 5px solid black;
            border-radius: 50%;
            border-top: 5px solid blue;

            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
     .wheel{
        width: 100px;
        height: 200px;
        border: 10px solid rgb(181, 80, 80);
        border-radius: 50%;
        margin: 100px;
        animation: spin1 1s linear  infinite ;

        }
        @keyframes spin1{
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
        }
        .colud{
            font-size: 100px;
            margin: 100px;
            animation: move 2s linear infinite forwards ;
        }
        @keyframes move{
            from{
                transform:translate(0) ;
            }
            to{
                transform: translate(1200px);
            }
        }
        .fiftyprcent{
            background: red;
            padding: 10px;
            text-align: center;
            translate: .5s;
            margin: 100px;
            border-radius: 50px;
            font-size: large;
        }
        .fiftyprcent:hover{
            transform: scale(1.1);
        }
       
    </style>
</head>

<body>

    <h1>Transaction and Animation</h1>
    <button>Action</button><br><br>
    <div class="box"></div><br><br>
    <div class="load"></div><br><br>
    <div class="wheel"></div><br><br>
    <div class="colud">☁️</div><br><br>
    <div class="fiftyprcent">50% sale </div><br><br>
     <button>submit</button><br><br>


</body>
</html>
