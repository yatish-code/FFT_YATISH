<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Result Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f1ee; color: #222; }
    .container { max-width: 1100px; margin: 40px auto; background: #fff; padding: 30px 35px 40px; box-shadow: 0 0 12px rgba(0,0,0,.08); }
    h1 { font-size: 2rem; margin: 0 0 20px; }
    p { font-size: 1.05rem; line-height: 1.6; }
    ul { margin: 15px 0 30px 25px; }
    li { margin: 8px 0; }
    .toolbar { display: flex; gap: 15px; flex-wrap: wrap; margin: 20px 0; }
    input, select { padding: 10px 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
    .dashboard { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; margin-top: 15px; }
    .card { background: #f9f9f9; border: 1px solid #ddd; border-radius: 10px; padding: 18px; }
    .card h3 { margin-top: 0; }
    .meta { display: grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 10px; }
    .meta div { background: #fff; border: 1px solid #eee; padding: 10px; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #eee; }
    .pass { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
    .badge { display: inline-block; padding: 5px 10px; border-radius: 18px; font-size: 0.85rem; background: #dff5e6; color: #0a7b2f; }
  </style>
</head>
<body>
    <div class="toolbar">
      <input id="searchBox" type="text" placeholder="Search student by name or roll" />
      <select id="filterGrade">
        <option value="All">All Grades</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="F">F</option>
      </select>
    </div>

    <div class="dashboard">
      <div class="card">
        <h3>Student Details</h3>
        <div id="studentDetails" class="meta"></div>
      </div>
      <div class="card">
        <h3>Performance Summary</h3>
        <div id="summary"></div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Roll No</th>
          <th>Class</th>
          <th>Total</th>
          <th>Average</th>
          <th>Percentage</th>
          <th>Grade</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="resultTable"></tbody>
    </table>
  </div>

  <script>
    const students = [
      { name: 'B YATISH', roll: '101', className: 'X-A', marks: { Math: 90, Science: 88, English: 92, History: 81, Computer: 95 } },
      { name: 'Arjun Reddy', roll: '102', className: 'X-A', marks: { Math: 75, Science: 80, English: 78, History: 70, Computer: 82 } },
      { name: 'Udiat Sharma', roll: '103', className: 'X-B', marks: { Math: 66, Science: 71, English: 74, History: 69, Computer: 80 } },
      { name: 'Riwan', roll: '104', className: 'X-B', marks: { Math: 58, Science: 60, English: 62, History: 65, Computer: 57 } },
      { name: 'Mahi Jain', roll: '105', className: 'X-C', marks: { Math: 92, Science: 91, English: 89, History: 90, Computer: 94 } }
    ];

    function getGrade(percent) {
      if (percent >= 90) return 'A';
      if (percent >= 75) return 'B';
      if (percent >= 60) return 'C';
      if (percent >= 40) return 'D';
      return 'F';
    }

    function compute(student) {
      const values = Object.values(student.marks);
      const total = values.reduce((sum, v) => sum + v, 0);
      const average = total / values.length;
      const percentage = (total / (values.length * 100)) * 100;
      const grade = getGrade(percentage);
      const status = percentage >= 40 ? 'Pass' : 'Fail';
      return { total, average, percentage: percentage.toFixed(2), grade, status };
    }

    const searchBox = document.getElementById('searchBox');
    const filterGrade = document.getElementById('filterGrade');
    const tableBody = document.getElementById('resultTable');
    const studentDetails = document.getElementById('studentDetails');
    const summary = document.getElementById('summary');

    function renderStudent(student) {
      const result = compute(student);
      const list = Object.entries(student.marks)
        .map(([sub, mark]) => `<div><strong>${sub}</strong><br>${mark}</div>`)
        .join('');
      studentDetails.innerHTML = `
        <div><strong>Name:</strong> ${student.name}</div>
        <div><strong>Roll No:</strong> ${student.roll}</div>
        <div><strong>Class:</strong> ${student.className}</div>
        <div><strong>Result:</strong> <span class="${result.status === 'Pass' ? 'pass' : 'fail'}">${result.status}</span></div>
        <div><strong>Grade:</strong> <span class="badge">${result.grade}</span></div>
        <div><strong>Marks:</strong></div>
        <div class="meta">${list}</div>
      `;
      summary.innerHTML = `
        <p><strong>Total:</strong> ${result.total}</p>
        <p><strong>Average:</strong> ${result.average.toFixed(2)}</p>
        <p><strong>Percentage:</strong> ${result.percentage}%</p>
        <p><strong>Status:</strong> <span class="${result.status === 'Pass' ? 'pass' : 'fail'}">${result.status}</span></p>
      `;
    }

    function renderTable(filtered) {
      tableBody.innerHTML = filtered.map(student => {
        const result = compute(student);
        return `
          <tr onclick="renderStudent(students.find(s => s.roll === '${student.roll}'))" style="cursor:pointer;">
            <td>${student.name}</td>
            <td>${student.roll}</td>
            <td>${student.className}</td>
            <td>${result.total}</td>
            <td>${result.average.toFixed(2)}</td>
            <td>${result.percentage}%</td>
            <td>${result.grade}</td>
            <td class="${result.status === 'Pass' ? 'pass' : 'fail'}">${result.status}</td>
          </tr>
        `;
      }).join('');
    }

    function updateDashboard() {
      const query = searchBox.value.toLowerCase();
      const grade = filterGrade.value;
      const filtered = students.filter(student => {
        const matchesText = student.name.toLowerCase().includes(query) || student.roll.includes(query);
        const matchesGrade = grade === 'All' || getGrade(parseFloat(compute(student).percentage)) === grade;
        return matchesText && matchesGrade;
      });
      if (filtered.length) renderStudent(filtered[0]);
      renderTable(filtered);
    }

    searchBox.addEventListener('input', updateDashboard);
    filterGrade.addEventListener('change', updateDashboard);
    renderStudent(students[0]);
    renderTable(students);
  </script>
</body>
</html>
